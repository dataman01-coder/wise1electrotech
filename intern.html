<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <!-- This is the intern contact form page -->

      <div class="top">
        <h1>Worker | Trainee Details Form</h1>
        <p>Download the interns form and fill in your particulars below.</p>
       <div class="agree">
        <a href="pics/INTERNS FORM copy.pdf" download="INTERNSHIP_FORM_WISE_1_ELECTROTECH_ENG.pdf">Download Form</a>
        <a href="pics/AGREEMENT FORM.pdf" download="AGREEMENT FORM - WISE1ELECTROTECH_ENG.pdf">Agreement Form</a>
       </div>
    </div>

    <!-- FORM -->
    <form action="" class="container">
        <!-- passport section -->
        <div class="sec-01">
            <input type="file" placeholder="Upload your passport picture">
            <label for="file">Upload your passport picture</label>
        </div>
        <div class="sec-02">
            <h1>Personal Information</h1>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">Name</label>
                <input type="text">
            </div>
            <div class="field">
                <label for="">Last Name</label>
                <input type="text">
            </div>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">Email</label>
                <input type="text">
            </div>
            <div class="field">
                <label for="">Date of birth</label>
                <input type="text">
            </div>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">Gender</label>
                <input type="text">
            </div>
            <div class="field">
                <label for="">Marital Status</label>
                <input type="text">
            </div>
        </div>
        <div class="sec-02">
            <h1>Contact information</h1>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">City</label>
                <input type="text">
            </div>
            <div class="field">
                <label for="">State</label>
                <input type="text">
            </div>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">Home address</label>
                <input type="text" style="width:840px;">
            </div>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">Phone Number</label>
                <input type="text">
            </div>
            <div class="field">
                <label for="">Nationality</label>
                <input type="text">
            </div>
        </div>
        <div class="sec-02">
            <h1>Emergency contact details</h1>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">Contact persons name</label>
                <input type="text">
            </div>
            <div class="field">
                <label for="">Relationship</label>
                <input type="text">
            </div>
        </div>
        <div class="sec-03">
            <div class="field">
                <label for="">Phone Number</label>
                <input type="text">
            </div>
            <div class="field">
                <label for="">Email Address</label>
                <input type="text">
            </div>
        </div>
        <button type="submit" class="submit-btn">Done & Submit</button>
    </form>

</body>
</html>
